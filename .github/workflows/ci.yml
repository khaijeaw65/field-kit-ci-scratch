# field-kit CI (G2). Harvested from a shipped project; adjust services/env per project.
# Ruleset requires the status check named `ci` — the last job aggregates the others.
name: ci

on:
  push:
    branches: ['feat/**', 'fix/**', 'main']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # Remove services the project does not use; add project env (test secrets only) below.
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TURBO_TELEMETRY_DISABLED: 1
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: app
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "PM=pnpm" >> "$GITHUB_ENV"; else echo "PM=npm" >> "$GITHUB_ENV"; fi
      # pnpm/action-setup reads the version from package.json "packageManager" (e.g. "pnpm@9.15.0") — set it, or add `with: { version: … }`.
      - uses: pnpm/action-setup@v4
        if: env.PM == 'pnpm'
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: '${{ env.PM }}' }
      - name: Install
        run: if [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile; else npm ci; fi
      - name: Lint, typecheck, unit (affected when turbo is present)
        run: |
          set -euo pipefail
          if [ -f turbo.json ]; then
            BASE=origin/main; [ "${GITHUB_REF_NAME}" = main ] && BASE=HEAD~1
            $PM exec turbo run lint typecheck test --filter="...[$BASE]"
          else
            $PM run --if-present lint && $PM run --if-present typecheck && $PM run --if-present test
          fi
      - name: e2e
        run: if [ "$PM" = pnpm ]; then pnpm -r --if-present run test:e2e; else npm run --if-present test:e2e; fi
      - name: OpenAPI spec matches code
        run: |
          if [ "$PM" = pnpm ]; then pnpm -r --if-present run openapi:check; else npm run --if-present openapi:check; fi

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Acceptance lock
        run: bash scripts/field-kit/check-lock.sh

  ci:
    if: always()
    needs: [checks, lock]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          [ "${{ needs.checks.result }}" = success ] && [ "${{ needs.lock.result }}" = success ] || exit 1
